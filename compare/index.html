<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before and After</title>
<meta name="description" content="The old and new 24/6 Locksmith homepages, compared with a drag.">
<style>
  :root {
    --ground: #E9F1F5;
    --ink: #0F2438;
    --chrome: #F2F3F5;
    --chrome-line: #E1E4E8;
    --pill: #E4E7EB;
    --pill-ink: #4B5563;
    --shadow-hero: 0 0 0 1px rgba(15, 36, 56, .08), 0 28px 64px -18px rgba(15, 36, 56, .34), 0 8px 18px -8px rgba(15, 36, 56, .12);
    --travel: cubic-bezier(0.45, 0, 0.1, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Scale-to-fit wrapper: the stage is designed at a fixed size and scaled down to the column */
  .fit { width: 100%; max-width: 1080px; }
  .fit[data-layout="compact"] { max-width: 358px; }
  .stage {
    position: relative; overflow: hidden;
    background: var(--ground);
    border-radius: 16px;
    transform-origin: 0 0;
  }
  .stage[data-layout="wide"] { width: 1080px; height: 620px; }
  .stage[data-layout="compact"] { width: 358px; height: 580px; }

  /* ---------- Browser window (wide) ---------- */
  .win {
    position: absolute; left: 60px; top: 48px; width: 960px; height: 640px;
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: var(--shadow-hero);
  }
  .bar {
    position: relative; height: 38px;
    background: var(--chrome); border-bottom: 1px solid var(--chrome-line);
  }
  .lights { position: absolute; left: 13px; top: 13px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
  .lights i:nth-child(1) { background: #FF5F57; }
  .lights i:nth-child(2) { background: #FEBC2E; }
  .lights i:nth-child(3) { background: #28C840; }
  .url {
    position: absolute; left: 50%; top: 7px; transform: translateX(-50%);
    height: 24px; padding: 0 16px; min-width: 260px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--pill); border-radius: 12px;
    font-size: 12.5px; color: var(--pill-ink); letter-spacing: .01em;
  }
  .url svg { width: 11px; height: 11px; fill: var(--pill-ink); flex: none; }
  .view { position: absolute; left: 0; top: 38px; width: 960px; height: 600px; overflow: hidden; }

  /* ---------- Phone (compact) ---------- */
  .phone {
    position: absolute; left: 29px; top: 28px; width: 300px; height: 660px;
    border-radius: 46px; background: #F7F8FA; padding: 10px;
    box-shadow: var(--shadow-hero);
  }
  .phone .view { position: relative; left: 0; top: 0; width: 280px; height: 640px; border-radius: 36px; background: #fff; }

  /* ---------- The comparison ---------- */
  .layer { position: absolute; inset: 0; }
  .layer img { display: block; width: 100%; height: auto; }
  .layer.new { clip-path: inset(0 0 0 var(--x)); }
  .divider {
    position: absolute; top: 0; bottom: 0; left: var(--x);
    width: 2px; margin-left: -1px; background: #fff;
    box-shadow: 0 0 0 1px rgba(15, 36, 56, .14);
  }
  .handle {
    position: absolute; left: var(--hx); top: var(--hy);
    width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: #fff; color: var(--ink);
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(15, 36, 56, .12), 0 6px 16px -4px rgba(15, 36, 56, .35);
    transform: scale(var(--press, 1));
  }
  .handle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .compact .handle { width: 36px; height: 36px; margin: -18px 0 0 -18px; }
  .compact .handle svg { width: 16px; height: 16px; }

  .tag {
    position: absolute; top: 16px;
    padding: 6px 11px 6px; border-radius: 999px;
    background: var(--ink); color: #fff;
    font-size: 13px; font-weight: 600; line-height: 1;
    text-box: trim-both cap alphabetic;
  }
  .wide .tag { top: 76px; }
  .tag.before { left: 16px; }
  .tag.after { right: 16px; }
  .compact .tag { top: 14px; font-size: 12px; padding: 6px 10px; }
  .compact .tag.before { left: 14px; }
  .compact .tag.after { right: 14px; }

  /* ---------- Pointer ---------- */
  .cursor { position: absolute; left: 0; top: 0; width: 24px; height: 24px; pointer-events: none; will-change: transform; }
  .cursor svg { position: absolute; inset: 0; width: 24px; height: 24px; transition: opacity .12s; overflow: visible; }
  .cursor .arrow { margin: -3px 0 0 -5px; }       /* hotspot at the arrow's tip */
  .cursor .ew { margin: -12px 0 0 -12px; }        /* hotspot at the center */
  .cursor[data-kind="arrow"] .ew, .cursor[data-kind="ew"] .arrow { opacity: 0; }
  .touch {
    position: absolute; left: 0; top: 0; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: rgba(15, 36, 56, .16);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .95), 0 0 0 1px rgba(15, 36, 56, .18);
    pointer-events: none; opacity: 0; will-change: transform, opacity;
  }
</style>
</head>
<body>

<div class="fit" id="fit">
  <div class="stage" id="stage" role="img" aria-label="The old 24/6 Locksmith homepage and the new one, compared with a slider that is dragged from one to the other."></div>
</div>

<template id="wide">
  <div class="win">
    <div class="bar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="url"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 7V5a3.5 3.5 0 1 1 7 0v2h.5A1.5 1.5 0 0 1 13.5 8.5v5A1.5 1.5 0 0 1 12 15H4a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 4 7h.5Zm1.5 0h4V5a2 2 0 1 0-4 0v2Z"/></svg>mylocknow.com</div>
    </div>
    <div class="view" data-view>
      <div class="layer old"><img src="old-desktop.webp" alt=""></div>
      <div class="layer new"><img src="new-desktop.webp" alt=""></div>
      <div class="tag before">Before</div>
      <div class="tag after" data-after>After</div>
      <div class="divider"></div>
      <div class="handle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7-5 5 5 5"/><path d="m15 7 5 5-5 5"/></svg></div>
    </div>
  </div>
  <div class="cursor" data-kind="arrow">
    <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v17.2l4.6-4.3 3.1 6.9 3-1.3-3.1-6.7H19L5 3Z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <svg class="ew" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12 7 6.5V10h10V6.5l5.5 5.5-5.5 5.5V14H7v3.5L1.5 12Z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
</template>

<template id="compact">
  <div class="phone">
    <div class="view" data-view>
      <div class="layer old"><img src="old-mobile.webp" alt=""></div>
      <div class="layer new"><img src="new-mobile.webp" alt=""></div>
      <div class="tag before">Before</div>
      <div class="tag after" data-after>After</div>
      <div class="divider"></div>
      <div class="handle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7-5 5 5 5"/><path d="m15 7 5 5-5 5"/></svg></div>
    </div>
  </div>
  <div class="touch"></div>
</template>

<script>
(function () {
  const fit = document.getElementById("fit");
  const stage = document.getElementById("stage");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LOOP = 12000;

  // Designs: everything in stage coordinates. view = the screen's offset in the stage.
  const DESIGNS = {
    wide:    { w: 1080, h: 620, view: { x: 60, y: 86, w: 960 },  handleY: 300, inset: 34, tag: [120, 60], from: 1, to: 0, rest: { x: 690, y: 520 } },
    compact: { w: 358,  h: 580, view: { x: 39, y: 38, w: 280 },  handleY: 478, inset: 30, tag: [84, 36], from: 1, to: 0, rest: null }
  };

  // Easing: travel curve from the skill's motion rules, as a cubic-bezier solver.
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t;
    const sy = (t) => ((ay * t + by) * t + cy) * t;
    const dsx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      let t = x;
      for (let i = 0; i < 8; i++) { const d = sx(t) - x; if (Math.abs(d) < 1e-5) break; t -= d / (dsx(t) || 1e-6); }
      return sy(Math.min(1, Math.max(0, t)));
    };
  }
  const travel = bezier(0.45, 0, 0.1, 1);
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;

  let layout, D, el = {};

  function build() {
    layout = fit.clientWidth < 560 ? "compact" : "wide";
    D = DESIGNS[layout];
    stage.dataset.layout = layout;
    fit.dataset.layout = layout;
    stage.className = "stage " + layout;
    stage.innerHTML = "";
    stage.appendChild(document.getElementById(layout).content.cloneNode(true));
    el.view = stage.querySelector("[data-view]");
    el.cursor = stage.querySelector(".cursor");
    el.touch = stage.querySelector(".touch");
    el.before = stage.querySelector(".tag.before");
    el.after = stage.querySelector("[data-after]");
    el.line = stage.querySelector(".divider");
    el.view.style.setProperty("--hy", D.handleY + "px");
    scale();
  }

  function scale() {
    const s = Math.min(1, fit.clientWidth / D.w);
    stage.style.transform = `scale(${s})`;
    fit.style.height = D.h * s + "px";
  }

  // ---- One loop, as a pure function of time, so any frame can be filmed ----
  // Beats: rest on the old site → reach the handle → press → drag to the new site →
  // hold the payoff → press → drag back → release and drift away → rest (= first frame).
  function render(t) {
    const W = D.view.w;
    // The line runs edge to edge; the handle stays a gutter inside the screen.
    const hx = (f) => D.view.x + Math.min(W - D.inset, Math.max(D.inset, f * W));
    const hy = D.view.y + D.handleY;
    let f = D.from, press = 1;
    let cx, cy, kind = "arrow", touch = 0;

    const tReach = [600, 1500], tPress1 = [1500, 1650], tDrag1 = [1650, 4250];
    const tPress2 = [6750, 6900], tDrag2 = [6900, 9100], tLeave = [9300, 10200];

    // divider position
    if (t < tDrag1[0]) f = D.from;
    else if (t < tDrag1[1]) f = lerp(D.from, D.to, travel(seg(t, ...tDrag1)));
    else if (t < tDrag2[0]) f = D.to;
    else if (t < tDrag2[1]) f = lerp(D.to, D.from, travel(seg(t, ...tDrag2)));
    else f = D.from;

    // press feedback: a quick dip while held
    const held = (t >= tPress1[0] && t < tDrag1[1]) || (t >= tPress2[0] && t < tDrag2[1]);
    if (held) {
      const p1 = seg(t, tPress1[0], tPress1[1]), p2 = seg(t, tPress2[0], tPress2[1]);
      press = t < tDrag1[1] ? lerp(1, 0.92, p1) : lerp(1, 0.92, p2);
    }

    if (layout === "wide") {
      const rest = D.rest, G = { x: 10, y: 12 }, grip = { x: hx(D.from) + G.x, y: hy + G.y };
      if (t < tReach[0]) { cx = rest.x; cy = rest.y; }
      else if (t < tReach[1]) {
        const p = travel(seg(t, ...tReach));
        cx = lerp(rest.x, grip.x, p); cy = lerp(rest.y, grip.y, p) - Math.sin(p * Math.PI) * 26;
      } else if (t < tLeave[0]) { cx = hx(f) + G.x; cy = hy + G.y; }
      else if (t < tLeave[1]) {
        const p = travel(seg(t, ...tLeave));
        cx = lerp(grip.x, rest.x, p); cy = lerp(grip.y, rest.y, p) - Math.sin(p * Math.PI) * 26;
      } else { cx = rest.x; cy = rest.y; }
      // the kind switches as the pointer crosses the handle's edge, not after arriving
      kind = Math.hypot(cx - hx(f), cy - hy) < 24 ? "ew" : "arrow";
      el.cursor.dataset.kind = kind;
      el.cursor.style.transform = `translate(${cx}px, ${cy}px)`;
    } else {
      // touch: a dot only where the finger presses and drags
      const down = (a, b) => seg(t, a, a + 140) * (1 - seg(t, b, b + 160));
      touch = Math.max(down(tPress1[0], tDrag1[1]), down(tPress2[0], tDrag2[1]));
      el.touch.style.opacity = touch;
      el.touch.style.transform = `translate(${hx(f)}px, ${hy}px) scale(${lerp(0.7, 1, touch)})`;
    }

    place(f, press);
  }

  function place(f, press) {
    const W = D.view.w, x = f * W;
    el.view.style.setProperty("--x", x + "px");
    el.view.style.setProperty("--hx", Math.min(W - D.inset, Math.max(D.inset, x)) + "px");
    el.view.style.setProperty("--press", press);
    // each label leaves as its side gets too narrow to hold it; the line fades at the very edge
    const [start, span] = D.tag;
    el.before.style.opacity = clamp((x - start) / span);
    el.after.style.opacity = clamp((W - x - start) / span);
    el.line.style.opacity = clamp(Math.min(x, W - x) / 12);
  }

  function poster() {
    // Reduced motion and thumbnails: the divider halfway, both sites legible, no pointer.
    place(0.5, 1);
    if (el.cursor) el.cursor.style.display = "none";
    if (el.touch) el.touch.style.display = "none";
  }

  build();
  let raf, t0 = null, seekMode = false;
  function frame(now) {
    if (t0 === null) t0 = now;
    render((now - t0) % LOOP);
    raf = requestAnimationFrame(frame);
  }
  function start() {
    cancelAnimationFrame(raf);
    if (reduce) { poster(); return; }
    if (!seekMode) raf = requestAnimationFrame(frame);
  }
  start();

  let lastLayout = layout;
  addEventListener("resize", () => {
    const next = fit.clientWidth < 560 ? "compact" : "wide";
    if (next !== lastLayout) { lastLayout = next; build(); t0 = null; start(); }
    else scale();
  });

  // For filming frame by frame: __seek(ms) stops playback and draws that moment.
  window.__seek = (ms) => { seekMode = true; cancelAnimationFrame(raf); render(ms % LOOP); };
  window.__poster = () => { seekMode = true; cancelAnimationFrame(raf); poster(); };
})();
</script>
</body>
</html>
